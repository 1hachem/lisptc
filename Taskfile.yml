version: '3'
dotenv: ['.env']
silent: true
vars:
  PROJECTID: 2601ca1c-d740-482b-b0f9-62ad78773f62
tasks:
  default:
    desc: prints this help
    cmd: task -l

  _infisical-run:
    requires:
      vars: [ENV, PATHS, CMD]
    vars:
      DIR: '{{.DIR | default "."}}'
    # node directly rather than `pnpm tsx`: pnpm exits 130 on the Ctrl-C that
    # reaches the whole process group, which makes task report a failed task on
    # every ordinary shutdown. Run the script as task's own child so its exit
    # code is the one task sees.
    cmd: |
      node --no-warnings --experimental-transform-types ./scripts/infisical-run.ts -e {{.ENV}} \
       --projectId={{.PROJECTID}} \
       --paths="{{.PATHS}}" --dir={{.DIR}} "{{.CMD}}"

  test:
    desc: run all tests (interpreter + nix flake checks)
    cmds:
      - task: test:pnpm
      - task: test:nix
      - task: test:nvim

  test:pnpm:
    desc: run the interpreter test suite (vitest via turbo)
    cmd: pnpm test

  test:nix:
    desc: run the nix flake checks (includes the ptcfmt formatter test)
    vars:
      SYSTEM:
        sh: nix eval --impure --raw --expr builtins.currentSystem
    cmds:
      - nix flake check --no-warn-dirty
      # nix flake check hides check output once cached; print the stored
      # ptcfmt test summary so the pass count is always visible.
      - nix build --no-warn-dirty --no-link ".#checks.{{.SYSTEM}}.ptcfmt"
      - nix log --no-warn-dirty ".#checks.{{.SYSTEM}}.ptcfmt"

  test:nvim:
    desc: run the nvim integration test
    cmd: bash editors/nvim/tests/run.sh
  
  dev:
    deps: [dev-app, dev-api]

  dev-app:
    desc: run pi agent with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: dev, PATHS: "", CMD: "pnpm run dev --filter app" }
    
  dev-api:
    desc: run api with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: dev, PATHS: "/ai /analytics", CMD: "pnpm run dev --filter api" }

  start:
    desc: build and serve both the app and the api
    deps: [start:app, start:api]

  # `build` goes through the root script, so turbo caches it and builds whatever
  # the workspace depends on first; `start` exists only on the workspace itself.
  # Both halves run under the same secrets, since the build reads env too.
  start:app:
    desc: build the app and serve the built output with access to secrets
    cmds:
      - task: _infisical-run
        # `ENV=prod task start:app` to serve against another Infisical environment.
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "", CMD: "pnpm run build --filter app && pnpm --filter app start" }

  start:api:
    desc: build the api and serve the built output with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "/ai /analytics", CMD: "pnpm run build --filter api && pnpm --filter api start" }

  pi:
    desc: run pi agent with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: dev, PATHS: "/ai /repl", CMD: "pnpm run pi" }

  serve-gemma:
    desc: serve the local gemma model (the API primes its system-prompt KV cache)
    cmd: packages/ai/scripts/serve-llama.sh

  repl:
    desc: run the interactive REPL against a local (private) interpreter
    cmd: pnpm repl

  repl:attach:
    desc: attach an interactive REPL to the shared session (spawns the server if needed)
    cmd: pnpm repl:attach

  repl:status:
    desc: list running shared REPL session servers and their sockets
    cmd: |
      pgrep -af "session-server.ts --serve" || echo "no session server running"

  repl:kill:
    desc: kill the shared REPL session server(s) so the next client spawns a fresh one
    cmd: |
      pkill -f "session-server.ts --serve" || true
      rm -f "${XDG_RUNTIME_DIR:-/tmp}"/lisptc-*.sock

  repl:restart:
    desc: kill the shared session server(s) then attach a fresh REPL
    cmds:
      - task: repl:kill
      - task: repl:attach
