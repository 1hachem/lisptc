version: '3'
dotenv: ['.env']
silent: true
vars:
  PROJECTID: 2601ca1c-d740-482b-b0f9-62ad78773f62
tasks:
  default:
    desc: prints this help
    cmd: task -l

  _infisical-run:
    requires:
      vars: [ENV, PATHS, CMD]
    vars:
      DIR: '{{.DIR | default "."}}'
    cmd: |
      node --no-warnings --experimental-transform-types ./scripts/infisical-run.ts -e {{.ENV}} \
       --projectId={{.PROJECTID}} \
       --paths="{{.PATHS}}" --dir={{.DIR}} "{{.CMD}}"

  test:
    desc: run all tests (interpreter + nix flake checks)
    cmds:
      - task: test:pnpm
      - task: test:nix
      - task: test:nvim

  test:pnpm:
    desc: run the interpreter test suite (vitest via turbo)
    cmd: pnpm test

  test:nix:
    desc: run the nix flake checks (includes the ptcfmt formatter test)
    vars:
      SYSTEM:
        sh: nix eval --impure --raw --expr builtins.currentSystem
    cmds:
      - nix flake check --no-warn-dirty
      - nix build --no-warn-dirty --no-link ".#checks.{{.SYSTEM}}.ptcfmt"
      - nix log --no-warn-dirty ".#checks.{{.SYSTEM}}.ptcfmt"

  test:nvim:
    desc: run the nvim integration test
    cmd: bash editors/nvim/tests/run.sh

  mcp:browser:build:
    desc: build the browser MCP image the playwright toolkit entry runs
    vars:
      TAG: '{{.TAG | default "v1.63.0"}}'
    cmd: docker build -f docker/browser-mcp.Dockerfile -t lisptc/browser-mcp:{{.TAG}} .

  mcp:reap:
    desc: remove MCP containers orphaned by a REPL that exited without (mcp-shutdown)
    cmd: |
      ids=$(docker ps -aq --filter label=lisptc.mcp.host)
      if [ -z "$ids" ]; then echo "no orphaned MCP containers"; else docker rm -f $ids; fi

  up:
    desc: build and run the whole stack in docker with live reload, secrets from infisical
    aliases:
      - dev
    deps: [mcp:browser:build]
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/db /convex /auth /api /web /ai /analytics"
          CMD: "DOCKER_TARGET=dev docker compose up --build --watch {{.CLI_ARGS}}"

  up:prod:
    desc: build and start the whole stack from its production images
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/db /convex /auth /api /web /ai /analytics"
          CMD: "DOCKER_TARGET=prod docker compose up -d --build {{.CLI_ARGS}}"
      - echo "app http://localhost:3000 · api http://localhost:3001 · dashboard http://127.0.0.1:6791"

  down:
    desc: stop the whole stack (pass -- -v to drop its data)
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/db /convex"
          CMD: "docker compose down {{.CLI_ARGS}}"

  convex:push:
    desc: push the convex functions and schema to the running deployment, once
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/convex /auth"
          CMD: "pnpm --filter @repo/backend exec convex dev --once"

  convex:dev:
    desc: watch convex/ and push the functions on every save
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/convex /auth"
          CMD: "pnpm --filter @repo/backend dev"

  r2:
    desc: mount the R2 bucket at .r2 (pass umount to unmount)
    vars:
      ACTION: '{{.CLI_ARGS | default "mount"}}'
    cmds:
      - task: _infisical-run
        vars:
          ENV: dev
          PATHS: "/assets"
          CMD: 'r2mount {{.ACTION}}'

  evals:run:
    desc: run the agent eval suite against real models
    vars:
      MATRIX: '{{.EVAL_MATRIX | default "digitalocean:gemma-4-31B-it"}}'
      JUDGE: '{{.EVAL_JUDGE | default "digitalocean:gemma-4-31B-it"}}'
      CONCURRENCY: '{{.EVAL_CONCURRENCY | default "4"}}'
    cmds:
      - task: _infisical-run
        vars:
          ENV: dev
          PATHS: "/ai /assets"
          CMD: 'EVAL_MATRIX="{{.MATRIX}}" EVAL_JUDGE="{{.JUDGE}}" EVAL_CONCURRENCY="{{.CONCURRENCY}}" pnpm test:evals'
  
  evals:open:
    desc: build the eval trace viewer, serve it, and open a browser on it
    vars:
      PORT: '{{.PORT | default "3200"}}'
      URL: 'http://localhost:{{.PORT}}'
    cmds:
      - |
        (
          for _ in $(seq 480); do
            if curl -sf -o /dev/null "{{.URL}}"; then
              if command -v xdg-open >/dev/null 2>&1; then xdg-open "{{.URL}}"
              elif command -v open >/dev/null 2>&1; then open "{{.URL}}"
              else echo "the tracer is at {{.URL}}"
              fi
              exit 0
            fi
            sleep 0.5
          done
          echo "the tracer never answered on {{.URL}}"
        ) >/dev/null 2>&1 &
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/assets /trace-viewer"
          CMD: 'PORT={{.PORT}} pnpm run build --filter @lisptc/trace-viewer && pnpm --filter @lisptc/trace-viewer start'

  evals:dev:
    desc: run the eval trace viewer in dev mode with access to secrets
    vars:
      PORT: '{{.PORT | default "3200"}}'
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/assets /trace-viewer"
          CMD: 'PORT={{.PORT}} pnpm run dev --filter @lisptc/trace-viewer'

  dev-app:
    desc: run the web app with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: dev, PATHS: "/web /analytics", CMD: "pnpm run dev --filter app" }
    
  dev-api:
    desc: run api with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: dev, PATHS: "/ai /analytics /api", CMD: "pnpm run dev --filter api" }

  start:
    desc: build and serve both the app and the api
    deps: [start:app, start:api]

  start:app:
    desc: build the app and serve the built output with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "/web /analytics", CMD: "pnpm run build --filter app && pnpm --filter app start" }

  start:api:
    desc: build the api and serve the built output with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "/ai /analytics /api", CMD: "pnpm run build --filter api && pnpm --filter api start" }


  mcp:sheets:
    desc: serve the Google Sheets MCP server (OAuth resource server on :8911)
    cmds:
      - task: _infisical-run
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "/mcps/google", CMD: "pnpm --silent --filter @lisptc/mcp-toolkit run sheets" }

  mcp:ocr:
    desc: serve the Mistral OCR MCP server on stdio
    cmds:
      - task: _infisical-run
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "/mcps/mistral", CMD: "pnpm --silent --filter @lisptc/mcp-toolkit run ocr" }

  repl:
    desc: run the interactive REPL against a local (private) interpreter
    cmd: pnpm repl

  repl:attach:
    desc: attach an interactive REPL to the shared session (spawns the server if needed)
    cmd: pnpm repl:attach

  repl:status:
    desc: list running shared REPL session servers and their sockets
    cmd: |
      pgrep -af "session-server.ts --serve" || echo "no session server running"

  repl:kill:
    desc: kill the shared REPL session server(s) so the next client spawns a fresh one
    cmd: |
      pkill -f "session-server.ts --serve" || true
      rm -f "${XDG_RUNTIME_DIR:-/tmp}"/lisptc-*.sock

  repl:restart:
    desc: kill the shared session server(s) then attach a fresh REPL
    cmds:
      - task: repl:kill
      - task: repl:attach
