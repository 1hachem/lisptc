version: '3'
dotenv: ['.env']
silent: true
includes:
  infisical:
    taskfile: ./taskfiles/infisical.yml
    flatten: true
  test: ./taskfiles/test.yml
  check: ./taskfiles/check.yml
  dashi-codes: ./taskfiles/dashi-codes.yml
  evals: ./taskfiles/evals.yml
  cluster: ./taskfiles/cluster.yml
  mcp-images:
    taskfile: ./taskfiles/mcp-images.yml
    flatten: true
tasks:
  default:
    desc: prints this help
    cmd: task -l

  desktop:
    desc: open the desktop app on this branch's open preview pull request, else on main, or on URL=<origin>
    vars:
      TAILNET: taild4910a.ts.net
      PREVIEW:
        sh: >
          gh pr view --json number,state,labels
          --jq 'select(.state == "OPEN" and any(.labels[]; .name == "preview")) | .number'
          2>/dev/null || true
      URL: '{{.URL | default (ternary (printf "https://lisptc-pr-%s.%s/" .PREVIEW .TAILNET) (printf "https://lisptc.%s/" .TAILNET) (ne .PREVIEW ""))}}'
    cmds:
      - echo "desktop on {{.URL}}"
      - LISPTC_DESKTOP_URL={{.URL}} pnpm --filter @lisptc/desktop dev

  mcp:reap:
    desc: remove MCP containers orphaned by a REPL that exited without (mcp-shutdown), and the volumes they kept their state on
    cmds:
      - |
        ids=$(docker ps -aq --filter label=lisptc.mcp.host)
        if [ -z "$ids" ]; then echo "no orphaned MCP containers"; else docker rm -f $ids; fi
      - task: mcp:reap:state

  mcp:reap:state:
    desc: delete the volumes MCP servers keep their state on, for one workspace or (WORKSPACE unset) all of them
    cmd: |
      filter="label=lisptc.mcp.state{{if .WORKSPACE}}={{.WORKSPACE}}{{end}}"
      volumes=$(docker volume ls -q --filter "$filter")
      if [ -z "$volumes" ]; then echo "no MCP state volumes"; else docker volume rm $volumes; fi

  registry:
    desc: start the local image registry tilt pushes to and k3s pulls from
    cmd: |
      docker start lisptc-registry >/dev/null 2>&1 \
        || docker run -d --restart unless-stopped -p 127.0.0.1:5000:5000 --name lisptc-registry registry:2 >/dev/null

  up:
    desc: run the whole stack on the local k3s cluster under tilt, in the lisptc-dev namespace, with live reload
    aliases:
      - dev
    deps: [mcp:images:build, registry, cluster:_reachable]
    cmds:
      - defer: setsid -w tilt down
      - tilt up --stream {{.CLI_ARGS}}

  up:convex:
    desc: bring up postgres and the convex backend on the local cluster, seed and deploy the functions, and wait until they are done
    deps: [registry, cluster:_reachable]
    cmd: |
      if tilt get session >/dev/null 2>&1; then
        tilt wait --for=condition=Ready --timeout=10m uiresource/convex-deploy
      else
        tilt ci convex-deploy
      fi

  up:prod-local:
    desc: build the production images and run them on the local cluster under tilt, against the dev secrets
    aliases:
      - up:prod
      - prod
    deps: [mcp:images:build, registry, cluster:_reachable]
    cmds:
      - defer: setsid -w tilt down
      - task: _infisical-run
        vars:
          ENV: dev
          PATHS: "/db /convex /auth /api /web /ai /analytics"
          CMD: 'WEB_BUILD_VARS=\"\$(env | grep ^VITE_)\" tilt up --stream --watch=false {{.CLI_ARGS}} -- --prod'

  down:
    desc: stop the stack on the local cluster (pass -- -v to drop its data)
    deps: [cluster:_reachable]
    cmds:
      - tilt down
      - '{{if eq .CLI_ARGS "-v"}}kubectl delete namespace lisptc-dev --ignore-not-found{{else}}true{{end}}'

  convex:push:
    desc: push the convex functions and schema to the local dev deployment, once (production releases through the cluster's convex-deploy Job)
    cmds:
      - task: _infisical-run
        vars:
          ENV: dev
          PATHS: "/convex"
          CMD: "./scripts/with-convex.sh pnpm --filter @repo/backend exec convex dev --once"

  convex:generate:
    desc: regenerate convex/_generated against the local deployment, without pushing
    deps: [up:convex]
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/convex /auth"
          CMD: "./scripts/with-convex.sh pnpm --filter @repo/backend exec convex codegen --typecheck disable"

  convex:dev:
    desc: watch convex/ and push the functions to the local dev deployment on every save
    cmds:
      - task: _infisical-run
        vars:
          ENV: dev
          PATHS: "/convex"
          CMD: "./scripts/with-convex.sh pnpm --filter @repo/backend dev"

  r2:
    desc: sync .r2 with the bucket (pull, push or sync; raw captures stay local)
    vars:
      ACTION: '{{.CLI_ARGS | default "pull"}}'
    cmds:
      - task: _infisical-run
        vars:
          ENV: dev
          PATHS: "/assets"
          CMD: 'bash scripts/r2-sync.sh {{.ACTION}}'

  r2:mount:
    desc: mount the R2 bucket at .r2-mount (pass umount to unmount)
    vars:
      ACTION: '{{.CLI_ARGS | default "mount"}}'
    cmds:
      - task: _infisical-run
        vars:
          ENV: dev
          PATHS: "/assets"
          CMD: 'r2mount {{.ACTION}}'

  dev-app:
    desc: run the web app with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: dev, PATHS: "/web /ai /analytics /api", CMD: "pnpm run dev --filter app" }

  start:
    desc: build the app and serve the built output with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "/web /ai /analytics /api", CMD: "pnpm run build --filter app && pnpm --filter app start" }


  mcp:sheets:
    desc: serve the Google Sheets MCP server (OAuth resource server on :8911)
    cmds:
      - task: _infisical-run
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "/mcps/google", CMD: "pnpm --silent --filter @lisptc/mcp-toolkit run sheets" }

  mcp:ocr:
    desc: serve the Mistral OCR MCP server on stdio
    cmds:
      - task: _infisical-run
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "/mcps/mistral", CMD: "pnpm --silent --filter @lisptc/mcp-toolkit run ocr" }

  mcp:grafana:
    desc: serve the Grafana MCP server on stdio, against the cluster's Grafana on the tailnet
    cmds:
      - task: _infisical-run
        vars: { ENV: prod, PATHS: "/grafana /tailnet", CMD: 'GRAFANA_URL=https://lisptc-grafana.\$TAILNET_DOMAIN docker run --rm -i --network host --add-host lisptc-grafana.\$TAILNET_DOMAIN:\$(tailscale ip -4 lisptc-grafana) -e GRAFANA_URL -e GRAFANA_USERNAME -e GRAFANA_PASSWORD grafana/mcp-grafana:2.0.2 -t stdio' }

  mcp:argocd:
    desc: serve the Argo CD MCP server on stdio, against the cluster's Argo CD on the tailnet
    cmds:
      - task: _infisical-run
        vars: { ENV: prod, PATHS: "/argocd /tailnet", CMD: 'docker run --rm -i --network host --add-host lisptc-argocd.\$TAILNET_DOMAIN:\$(tailscale ip -4 lisptc-argocd) -e ARGOCD_BASE_URL -e ARGOCD_API_TOKEN node:22-alpine npx --yes argocd-mcp@0.9.0 stdio' }

  repl:
    desc: run the interactive REPL against a local (private) interpreter
    cmd: pnpm repl

  repl:attach:
    desc: attach an interactive REPL to the shared session (spawns the server if needed)
    cmd: pnpm repl:attach

  repl:status:
    desc: list running shared REPL session servers and their sockets
    cmd: |
      pgrep -af "session-server.ts --serve" || echo "no session server running"

  repl:kill:
    desc: kill the shared REPL session server(s) so the next client spawns a fresh one
    cmd: |
      pkill -f "session-server.ts --serve" || true
      rm -f "${XDG_RUNTIME_DIR:-/tmp}"/lisptc-*.sock

  repl:restart:
    desc: kill the shared session server(s) then attach a fresh REPL
    cmds:
      - task: repl:kill
      - task: repl:attach
