version: '3'
dotenv: ['.env']
silent: true
vars:
  PROJECTID: 2601ca1c-d740-482b-b0f9-62ad78773f62
tasks:
  default:
    desc: prints this help
    cmd: task -l

  _infisical-run:
    requires:
      vars: [ENV, PATHS, CMD]
    vars:
      DIR: '{{.DIR | default "."}}'
    cmd: |
      pnpm tsx ./scripts/infisical-run.ts -e {{.ENV}} \
       --projectId={{.PROJECTID}} \
       --paths="{{.PATHS}}" --dir={{.DIR}} "{{.CMD}}"

  test:
    desc: run all tests (interpreter + nix flake checks)
    cmds:
      - task: test:pnpm
      - task: test:nix
      - task: test:nvim

  test:pnpm:
    desc: run the interpreter test suite (vitest via turbo)
    cmd: pnpm test

  test:nix:
    desc: run the nix flake checks (includes the ptcfmt formatter test)
    vars:
      SYSTEM:
        sh: nix eval --impure --raw --expr builtins.currentSystem
    cmds:
      - nix flake check --no-warn-dirty
      # nix flake check hides check output once cached; print the stored
      # ptcfmt test summary so the pass count is always visible.
      - nix build --no-warn-dirty --no-link ".#checks.{{.SYSTEM}}.ptcfmt"
      - nix log --no-warn-dirty ".#checks.{{.SYSTEM}}.ptcfmt"

  test:nvim:
    desc: run the nvim integration test
    cmd: bash editors/nvim/tests/run.sh
  
  dev:
    deps: [dev-app, dev-api, serve-gemma]

  dev-app:
    desc: run pi agent with access to secrets
    cmd: go-task _infisical-run ENV=dev PATHS="" CMD="pnpm run dev --filter app"
    
  dev-api:
    desc: run api with access to secrets
    cmd: go-task _infisical-run ENV=dev PATHS="/ai" CMD="pnpm run dev --filter api"

  pi:
    desc: run pi agent with access to secrets
    cmd: go-task _infisical-run ENV=dev PATHS="/ai /repl" CMD="pnpm run pi"

  serve-gemma:
    desc: serve the local gemma model (the API primes its system-prompt KV cache)
    cmd: packages/ai/scripts/serve-llama.sh

  repl:
    desc: run the interactive REPL against a local (private) interpreter
    cmd: pnpm repl

  repl:attach:
    desc: attach an interactive REPL to the shared session (spawns the server if needed)
    cmd: pnpm repl:attach

  repl:status:
    desc: list running shared REPL session servers and their sockets
    cmd: |
      pgrep -af "session-server.ts --serve" || echo "no session server running"

  repl:kill:
    desc: kill the shared REPL session server(s) so the next client spawns a fresh one
    cmd: |
      pkill -f "session-server.ts --serve" || true
      rm -f "${XDG_RUNTIME_DIR:-/tmp}"/lisptc-*.sock

  repl:restart:
    desc: kill the shared session server(s) then attach a fresh REPL
    cmds:
      - task: repl:kill
      - task: repl:attach
