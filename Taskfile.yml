version: '3'
dotenv: ['.env']
silent: true
vars:
  PROJECTID: 2601ca1c-d740-482b-b0f9-62ad78773f62
tasks:
  default:
    desc: prints this help
    cmd: task -l

  _infisical-run:
    requires:
      vars: [ENV, PATHS, CMD]
    vars:
      DIR: '{{.DIR | default "."}}'
    cmd: |
      set -eu
      # `infisical run --path` takes a single folder (the last flag wins), so to
      # pull from several paths we export each one to dotenv, merge them into the
      # environment, then exec the command. Later paths override earlier keys.
      env_file="$(mktemp)"
      trap 'rm -f "$env_file"' EXIT
      for p in {{.PATHS}}; do
        infisical export -e {{.ENV}} \
          --projectId={{.PROJECTID}} \
          --path="$p" --format=dotenv >> "$env_file"
      done
      cd {{.DIR}}
      set -a
      . "$env_file"
      set +a
      exec {{.CMD}}

  test:
    desc: run all tests (interpreter + nix flake checks)
    cmds:
      - task: test:pnpm
      - task: test:nix

  test:pnpm:
    desc: run the interpreter test suite (vitest via turbo)
    cmd: pnpm test

  test:nix:
    desc: run the nix flake checks (includes the ptcfmt formatter test)
    vars:
      SYSTEM:
        sh: nix eval --impure --raw --expr builtins.currentSystem
    cmds:
      - nix flake check --no-warn-dirty
      # nix flake check hides check output once cached; print the stored
      # ptcfmt test summary so the pass count is always visible.
      - nix build --no-warn-dirty --no-link ".#checks.{{.SYSTEM}}.ptcfmt"
      - nix log --no-warn-dirty ".#checks.{{.SYSTEM}}.ptcfmt"
  pi:
    desc: run pi agent with access to secrets
    cmd: go-task _infisical-run ENV=dev PATHS="/ai /repl" CMD="pnpm run pi"

  test-env:
    desc: run pi agent with access to secrets
    cmd: go-task _infisical-run ENV=dev PATHS="/ai /repl" CMD="printenv"
