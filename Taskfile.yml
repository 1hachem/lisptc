version: '3'
dotenv: ['.env']
silent: true
includes:
  infisical:
    taskfile: ./taskfiles/infisical.yml
    flatten: true
  test: ./taskfiles/test.yml
  check: ./taskfiles/check.yml
  dashi-codes: ./taskfiles/dashi-codes.yml
  evals: ./taskfiles/evals.yml
  cluster: ./taskfiles/cluster.yml
tasks:
  default:
    desc: prints this help
    cmd: task -l

  mcp:browser:build:
    desc: build the browser MCP image the playwright toolkit entry runs
    vars:
      TAG: '{{.TAG | default "main"}}'
    cmd: docker build -f docker/browser-mcp.Dockerfile -t ghcr.io/1hachem/lisptc-browser-mcp:{{.TAG}} .

  mcp:reap:
    desc: remove MCP containers orphaned by a REPL that exited without (mcp-shutdown)
    cmd: |
      ids=$(docker ps -aq --filter label=lisptc.mcp.host)
      if [ -z "$ids" ]; then echo "no orphaned MCP containers"; else docker rm -f $ids; fi

  mcp:reap:state:
    desc: delete the volumes MCP servers keep their state on, for one workspace or (WORKSPACE unset) all of them
    cmd: |
      filter="label=lisptc.mcp.state{{if .WORKSPACE}}={{.WORKSPACE}}{{end}}"
      volumes=$(docker volume ls -q --filter "$filter")
      if [ -z "$volumes" ]; then echo "no MCP state volumes"; else docker volume rm $volumes; fi

  mcp:operator:build:
    desc: build the MCP operator image the chart deploys
    vars:
      TAG: '{{.TAG | default "main"}}'
    cmd: docker build -f apps/mcp-operator/Dockerfile --target prod -t ghcr.io/1hachem/lisptc-mcp-operator:{{.TAG}} .

  up:
    desc: build and run the whole stack in docker with live reload, secrets from infisical
    aliases:
      - dev
    deps: [mcp:browser:build]
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/db /convex /auth /api /web /ai /analytics"
          CMD: 'WEB_BUILD_VARS=\"\$(env | grep ^VITE_)\" DOCKER_TARGET=dev docker compose up --build --watch {{.CLI_ARGS}}'

  up:prod:
    desc: build and start the whole stack from its production images
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/db /convex /auth /api /web /ai /analytics"
          CMD: 'WEB_BUILD_VARS=\"\$(env | grep ^VITE_)\" DOCKER_TARGET=prod docker compose up -d --build {{.CLI_ARGS}}'
      - echo "app http://localhost:3000 · dashboard http://127.0.0.1:6791"

  down:
    desc: stop the whole stack (pass -- -v to drop its data)
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/db /convex"
          CMD: "docker compose down {{.CLI_ARGS}}"

  convex:push:
    desc: push the convex functions and schema to the running deployment, once
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/convex /auth"
          CMD: "pnpm --filter @repo/backend exec convex dev --once"

  convex:generate:
    desc: regenerate convex/_generated against a throwaway local backend, no deployment or secrets needed
    vars:
      NAME: lisptc-codegen
      PORT: '{{.PORT | default "3299"}}'
      URL: http://127.0.0.1:{{.PORT}}
    cmd: |
      set -eu
      docker run -d --rm --name {{.NAME}} -e CONVEX_SITE_ORIGIN={{.URL}} \
        -p 127.0.0.1:{{.PORT}}:3210 ghcr.io/get-convex/convex-backend:latest > /dev/null
      trap 'docker stop {{.NAME}} > /dev/null' EXIT
      for _ in $(seq 60); do curl -sf {{.URL}}/version > /dev/null && break; sleep 1; done
      export CONVEX_SELF_HOSTED_URL={{.URL}}
      CONVEX_SELF_HOSTED_ADMIN_KEY=$(docker exec {{.NAME}} /convex/generate_admin_key.sh | tail -n1)
      export CONVEX_SELF_HOSTED_ADMIN_KEY
      pnpm --filter @repo/backend exec convex env set SITE_URL http://localhost:3000 > /dev/null
      pnpm --filter @repo/backend exec convex codegen --typecheck disable

  convex:dev:
    desc: watch convex/ and push the functions on every save
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/convex /auth"
          CMD: "pnpm --filter @repo/backend dev"

  r2:
    desc: sync .r2 with the bucket (pull, push or sync; raw captures stay local)
    vars:
      ACTION: '{{.CLI_ARGS | default "pull"}}'
    cmds:
      - task: _infisical-run
        vars:
          ENV: dev
          PATHS: "/assets"
          CMD: 'bash scripts/r2-sync.sh {{.ACTION}}'

  r2:mount:
    desc: mount the R2 bucket at .r2-mount (pass umount to unmount)
    vars:
      ACTION: '{{.CLI_ARGS | default "mount"}}'
    cmds:
      - task: _infisical-run
        vars:
          ENV: dev
          PATHS: "/assets"
          CMD: 'r2mount {{.ACTION}}'

  dev-app:
    desc: run the web app with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: dev, PATHS: "/web /ai /analytics /api", CMD: "pnpm run dev --filter app" }

  start:
    desc: build the app and serve the built output with access to secrets
    cmds:
      - task: _infisical-run
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "/web /ai /analytics /api", CMD: "pnpm run build --filter app && pnpm --filter app start" }


  mcp:sheets:
    desc: serve the Google Sheets MCP server (OAuth resource server on :8911)
    cmds:
      - task: _infisical-run
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "/mcps/google", CMD: "pnpm --silent --filter @lisptc/mcp-toolkit run sheets" }

  mcp:ocr:
    desc: serve the Mistral OCR MCP server on stdio
    cmds:
      - task: _infisical-run
        vars: { ENV: '{{.ENV | default "dev"}}', PATHS: "/mcps/mistral", CMD: "pnpm --silent --filter @lisptc/mcp-toolkit run ocr" }

  repl:
    desc: run the interactive REPL against a local (private) interpreter
    cmd: pnpm repl

  repl:attach:
    desc: attach an interactive REPL to the shared session (spawns the server if needed)
    cmd: pnpm repl:attach

  repl:status:
    desc: list running shared REPL session servers and their sockets
    cmd: |
      pgrep -af "session-server.ts --serve" || echo "no session server running"

  repl:kill:
    desc: kill the shared REPL session server(s) so the next client spawns a fresh one
    cmd: |
      pkill -f "session-server.ts --serve" || true
      rm -f "${XDG_RUNTIME_DIR:-/tmp}"/lisptc-*.sock

  repl:restart:
    desc: kill the shared session server(s) then attach a fresh REPL
    cmds:
      - task: repl:kill
      - task: repl:attach
