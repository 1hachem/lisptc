<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self' file:; style-src 'unsafe-inline'"
		/>
		<title>salsal</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f9f5d7;
				--fg: #3c3836;
				--dim: #7c6f64;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1d2021;
					--fg: #ebdbb2;
					--dim: #928374;
				}
			}
			html,
			body,
			#root {
				height: 100%;
				margin: 0;
			}
			body {
				background: var(--bg);
				color: var(--fg);
				font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
				-webkit-user-select: none;
				user-select: none;
			}
			.loading {
				height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 12px;
			}
			.glyph {
				width: 28px;
				height: 28px;
				color: var(--dim);
			}
			.title {
				margin: 0;
				font-size: 13px;
			}
			.detail {
				margin: 0;
				font-size: 12px;
				color: var(--dim);
			}
			.retry {
				margin-top: 4px;
				padding: 6px 14px;
				font: inherit;
				font-size: 12px;
				color: var(--fg);
				background: transparent;
				border: 1px solid var(--dim);
				border-radius: 6px;
				cursor: pointer;
			}
			.retry:hover {
				background: color-mix(in srgb, var(--dim) 15%, transparent);
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script src="./loading.js"></script>
	</body>
</html>
