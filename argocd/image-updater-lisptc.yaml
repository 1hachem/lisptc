apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: lisptc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: regexp:^release-[0-9a-f]{40}$
    forceUpdate: true
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: lisptc
      images:
        - alias: release
          imageName: ghcr.io/1hachem/lisptc-convex-deploy
          manifestTargets:
            helm:
              name: convexDeploy.image.repository
              tag: release.tag
