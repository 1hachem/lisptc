apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lisptc-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/1hachem/lisptc
    targetRevision: main
    path: charts/lisptc-crds
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
