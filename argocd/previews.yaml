apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: previews
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/1hachem/lisptc
        revision: previews
        files:
          - path: "pr-*.json"
        requeueAfterSeconds: 60
  template:
    metadata:
      name: "lisptc-pr-{{ .number }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/1hachem/lisptc
        targetRevision: "{{ .sha }}"
        path: charts/lisptc
        helm:
          valuesObject:
            preview:
              enabled: true
            app:
              hostname: "lisptc-pr-{{ .number }}"
              image:
                tag: "pr-{{ .number }}-{{ .sha }}"
            convexDeploy:
              image:
                tag: "pr-{{ .number }}-{{ .sha }}"
            mcpOperator:
              image:
                tag: "pr-{{ .number }}-{{ .sha }}"
            convex:
              hostnames:
                cloud: "lisptc-pr-{{ .number }}-convex"
      destination:
        server: https://kubernetes.default.svc
        namespace: "lisptc-pr-{{ .number }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
