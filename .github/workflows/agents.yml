name: AGENTS.md

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"

concurrency:
  group: agents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-only:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the model credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ci
          secret-path: /ai
          export-type: env

      - name: Rules, not implementation
        run: >
          node --no-warnings --experimental-transform-types
          ./scripts/check-agents.ts
          --base ${{ github.event.pull_request.base.sha }}

  live-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: References that still resolve
        run: >
          node --no-warnings --experimental-transform-types
          ./scripts/check-refs.ts
          --base ${{ github.event.pull_request.base.sha }}
