name: Resolve conflicts

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: resolve-conflicts-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || github.ref_name }}
    steps:
      - name: Read the branches
        run: |
          read -r number base head cross < <(gh pr view "$PR" --json number,baseRefName,headRefName,isCrossRepository --jq '"\(.number) \(.baseRefName) \(.headRefName) \(.isCrossRepository)"')
          if [ "$cross" = true ]; then
            echo "::error::PR $PR comes from a fork"
            exit 1
          fi
          echo "PR=$number" >> "$GITHUB_ENV"
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "HEAD_REF=$head" >> "$GITHUB_ENV"

      - name: Check for a merge conflict
        id: state
        run: |
          state=UNKNOWN
          for _ in 1 2 3 4 5 6; do
            state=$(gh pr view "$PR" --json mergeable --jq .mergeable)
            [ "$state" != UNKNOWN ] && break
            sleep 10
          done
          echo "PR $PR: $state"
          [ "$state" = CONFLICTING ] && echo "conflicting=true" >> "$GITHUB_OUTPUT" || true

      - name: Fetch the Claude credentials from Infisical
        if: steps.state.outputs.conflicting == 'true'
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /claude
          export-type: env

      - name: Checkout
        if: steps.state.outputs.conflicting == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Check whether the base changed a workflow
        if: steps.state.outputs.conflicting == 'true'
        id: workflows
        run: |
          git diff --name-only "$(git merge-base HEAD "origin/$BASE")" "origin/$BASE" -- .github/workflows > "$RUNNER_TEMP/workflows.txt"
          if [ -s "$RUNNER_TEMP/workflows.txt" ]; then
            cat "$RUNNER_TEMP/workflows.txt"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask for a manual merge on the PR
        if: steps.workflows.outputs.changed == 'true'
        run: |
          marker="<!-- resolve-conflicts:workflows -->"
          if gh pr view "$PR" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            exit 0
          fi
          {
            echo "$marker"
            echo "\`$BASE\` changed these workflows since this branch was cut, and the workflow token cannot push a merge that touches \`.github/workflows/\`:"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/workflows.txt"
            echo
            echo "Merge \`$BASE\` into \`$HEAD_REF\` by hand to resolve the conflicts."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"

      - name: Setup pnpm
        if: steps.state.outputs.conflicting == 'true' && steps.workflows.outputs.changed != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        if: steps.state.outputs.conflicting == 'true' && steps.workflows.outputs.changed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge the base branch
        if: steps.state.outputs.conflicting == 'true' && steps.workflows.outputs.changed != 'true'
        id: merge
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          if git merge --no-edit "origin/$BASE"; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          cat "$RUNNER_TEMP/conflicts.txt"
          echo "conflicted=true" >> "$GITHUB_OUTPUT"

      - name: Resolve with Claude
        if: steps.merge.outputs.conflicted == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: ${{ github.workspace }}/.agents
          plugins: merge-conflicts@lisptc
          prompt: '/merge-conflicts:resolve-conflicts PR #${{ env.PR }} merges origin/${{ env.BASE }} into ${{ env.HEAD_REF }}'
          claude_args: >-
            --model opus
            --max-turns 100
            --allowedTools "Read,Edit,Write,Grep,Glob,Agent,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(pnpm:*)"
            --disallowedTools "WebSearch,WebFetch"

      - name: Verify and commit
        if: steps.merge.outputs.conflicted == 'true'
        run: |
          mapfile -t files < "$RUNNER_TEMP/conflicts.txt"
          if grep -nE '^(<<<<<<<|>>>>>>>) ' -- "${files[@]}" 2>/dev/null; then
            echo "::error::Conflict markers remain"
            exit 1
          fi
          pnpm install --frozen-lockfile
          git add -A
          git commit --no-edit

      - name: Push
        if: steps.merge.outputs.conflicted == 'true'
        run: git push origin "HEAD:$HEAD_REF"

      - name: Report a failed resolution on the PR
        if: failure() && steps.merge.outputs.conflicted == 'true'
        run: |
          gh pr comment "$PR" --body "Claude could not resolve the merge conflicts with \`$BASE\` on its own. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
