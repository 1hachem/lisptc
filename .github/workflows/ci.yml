name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Fetch the turbo remote cache credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /turbo
          export-type: env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm lint

      - name: No comments
        uses: 1hachem/no-comments@v1

      - name: No stray docs
        run: pnpm check:docs

      - name: References that still resolve
        uses: 1hachem/check-agents-md@v1
        with:
          checks: refs
          all: true

      - name: Boundaries
        run: pnpm boundaries

      - name: Architecture
        run: pnpm check:arch

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Knip
        run: pnpm knip

      - name: Fallow
        run: pnpm fallow --base ${{ github.event.pull_request.base.sha || 'origin/main' }}

  test-plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the recorded test timings
        uses: actions/cache/restore@v4
        with:
          path: test-timings.json
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-

      - name: Plan the test shards
        id: plan
        run: |
          affected=${{ github.event_name == 'pull_request' && '--affected' || '' }}
          pnpm exec turbo run test:coverage $affected --dry=json > "$RUNNER_TEMP/dry-run.json"
          shards=$(pnpm -s test:shards plan "$RUNNER_TEMP/dry-run.json" test-timings.json)
          echo "$shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  test:
    needs: test-plan
    if: needs.test-plan.outputs.shards != '[]'
    name: test (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.test-plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Fetch the turbo remote cache credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /turbo
          export-type: env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm exec turbo run test:coverage --concurrency=2 --summarize ${{ matrix.shard.filters }}

      - name: Pack the coverage and the run summary
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/shard"
          find apps packages -path '*/coverage/coverage-final.json' -not -path '*/node_modules/*' \
            | tar -czf "$RUNNER_TEMP/shard/coverage.tgz" -T -
          cp -r .turbo/runs "$RUNNER_TEMP/shard/runs"

      - name: Upload the shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard
          retention-days: 1

  coverage:
    needs: [test-plan, test]
    if: ${{ !cancelled() && needs.test-plan.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the shards
        uses: actions/download-artifact@v4
        with:
          pattern: test-shard-*
          path: ${{ runner.temp }}/shards

      - name: Unpack the coverage
        run: |
          for archive in "$RUNNER_TEMP"/shards/*/coverage.tgz; do
            tar -xzf "$archive"
          done

      - name: Merge coverage
        run: pnpm coverage:merge

      - name: Report coverage on the PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HUSKY: "0"
        run: |
          dir="$RUNNER_TEMP/badges"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch origin badges
            git worktree add -B badges "$dir" origin/badges
          else
            git worktree add --orphan -b badges "$dir"
          fi
          cp coverage/badge.json "$dir/coverage.json"
          cp coverage/badge-interpreter.json "$dir/coverage-interpreter.json"
          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json coverage-interpreter.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update the coverage badge"
            git push origin badges
          fi

      - name: Restore the recorded test timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: test-timings.json
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-

      - name: Record the test timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pnpm -s test:shards record test-timings.json "$RUNNER_TEMP/shards" > "$RUNNER_TEMP/test-timings.json"
          mv "$RUNNER_TEMP/test-timings.json" test-timings.json

      - name: Save the recorded test timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: test-timings.json
          key: test-timings-${{ github.run_id }}

  test-nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: task test:nix

  test-nvim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Test
        run: bash editors/nvim/tests/run.sh

  charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.1

      - name: Setup Helmfile
        run: |
          curl -fsSL https://github.com/helmfile/helmfile/releases/download/v1.1.9/helmfile_1.1.9_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin helmfile

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: task cluster:lint

      - name: Render
        run: task cluster:render
