name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Fetch the turbo remote cache credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ci
          secret-path: /turbo
          export-type: env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint & format check
        run: pnpm lint

      - name: No comments
        uses: 1hachem/no-comments@v1

      - name: No stray docs
        run: pnpm check:docs

      - name: References that still resolve
        uses: 1hachem/check-agents-md@v1
        with:
          checks: refs
          all: true

      - name: Boundaries
        run: pnpm boundaries

      - name: Architecture
        run: pnpm check:arch

      - name: Knip
        run: pnpm knip

      - name: Fallow
        run: pnpm fallow --base ${{ github.event.pull_request.base.sha || 'origin/main' }}

      - name: Test with coverage
        run: pnpm test:coverage --concurrency=2

      - name: Merge coverage
        if: ${{ !cancelled() }}
        run: pnpm coverage:merge

      - name: Report coverage on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HUSKY: "0"
        run: |
          dir="$RUNNER_TEMP/badges"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch origin badges
            git worktree add -B badges "$dir" origin/badges
          else
            git worktree add --orphan -b badges "$dir"
          fi
          cp coverage/badge.json "$dir/coverage.json"
          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update the coverage badge"
            git push origin badges
          fi

  test-nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: task test:nix

  test-nvim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Test
        run: bash editors/nvim/tests/run.sh
