name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
        with:
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Fetch the turbo remote cache credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /turbo
          export-type: env

      - name: Typecheck
        run: pnpm typecheck

  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Lint & format check
        run: pnpm lint

      - name: No comments
        uses: 1hachem/no-comments@v1

      - name: No stray docs
        run: pnpm check:docs

      - name: References that still resolve
        uses: 1hachem/check-agents-md@v1
        with:
          checks: refs
          all: true

      - name: Boundaries
        run: pnpm boundaries

      - name: Architecture
        run: pnpm check:arch

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Knip
        run: pnpm knip

      - name: Fallow
        run: pnpm fallow --base ${{ github.event.pull_request.base.sha || 'origin/main' }}

  test:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      count: ${{ steps.plan.outputs.count }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Restore the recorded test timings
        uses: actions/cache/restore@v4
        with:
          path: test-timings.json
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-

      - name: Plan the test shards
        id: plan
        run: |
          affected=${{ github.event_name == 'pull_request' && '--affected' || '' }}
          pnpm exec turbo run test:coverage $affected --dry=json > "$RUNNER_TEMP/dry-run.json"
          pnpm -s test:shards plan "$RUNNER_TEMP/dry-run.json" test-timings.json > "$RUNNER_TEMP/shards.json"
          cat "$RUNNER_TEMP/shards.json"
          echo "count=$(jq length "$RUNNER_TEMP/shards.json")" >> "$GITHUB_OUTPUT"
          echo "filters=$(jq -r '.[${{ matrix.shard }} - 1].filters // empty' "$RUNNER_TEMP/shards.json")" >> "$GITHUB_OUTPUT"

      - name: Fetch the turbo remote cache credentials from Infisical
        if: steps.plan.outputs.filters != ''
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /turbo
          export-type: env

      - name: Test with coverage
        if: steps.plan.outputs.filters != ''
        run: pnpm exec turbo run test:coverage --concurrency=2 --summarize ${{ steps.plan.outputs.filters }}

      - name: Report the lone shard
        if: ${{ !cancelled() && steps.plan.outputs.count == '1' }}
        uses: ./.github/actions/report-coverage
        with:
          runs: .turbo/runs

      - name: Pack the coverage and the run summary
        if: ${{ !cancelled() && steps.plan.outputs.filters != '' && steps.plan.outputs.count != '1' }}
        run: |
          mkdir -p "$RUNNER_TEMP/shard"
          find apps packages -path '*/coverage/coverage-final.json' -not -path '*/node_modules/*' \
            | tar -czf "$RUNNER_TEMP/shard/coverage.tgz" -T -
          cp -r .turbo/runs "$RUNNER_TEMP/shard/runs"

      - name: Upload the shard
        if: ${{ !cancelled() && steps.plan.outputs.filters != '' && steps.plan.outputs.count != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard
          retention-days: 1

  coverage:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.count != '' && fromJSON(needs.test.outputs.count) > 1 }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup

      - name: Download the shards
        uses: actions/download-artifact@v4
        with:
          pattern: test-shard-*
          path: ${{ runner.temp }}/shards

      - name: Unpack the coverage
        run: |
          for archive in "$RUNNER_TEMP"/shards/*/coverage.tgz; do
            tar -xzf "$archive"
          done

      - name: Restore the recorded test timings
        uses: actions/cache/restore@v4
        with:
          path: test-timings.json
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-

      - name: Report the merged shards
        uses: ./.github/actions/report-coverage
        with:
          runs: ${{ runner.temp }}/shards

  test-nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: task test:nix

  test-nvim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Test
        run: bash editors/nvim/tests/run.sh

  charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.1

      - name: Setup Helmfile
        run: |
          curl -fsSL https://github.com/helmfile/helmfile/releases/download/v1.1.9/helmfile_1.1.9_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin helmfile

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: task cluster:lint

      - name: Render
        run: task cluster:render
