name: Evals

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      matrix:
        description: "provider:model pairs, comma separated (default: the EVAL_MATRIX variable)"
        required: false
        default: ""
      judge:
        description: "provider:model for the recap judge, or none (default: the EVAL_JUDGE variable)"
        required: false
        default: ""

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The action takes one secret-path per step and has no multi-path input,
      # so each path the evals need is its own step.
      - name: Fetch the model credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ci
          secret-path: /ai
          export-type: env

      - name: Fetch the R2 report-store credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ci
          secret-path: /assets
          export-type: env

      - name: Evals
        run: pnpm test:evals
        env:
          EVAL_MATRIX: ${{ inputs.matrix || vars.EVAL_MATRIX }}
          EVAL_JUDGE: ${{ inputs.judge || vars.EVAL_JUDGE }}
          EVAL_STORAGE: r2

      # The report goes to R2; anything on disk here is the fallback copy a
      # failed upload left behind, so an unreachable bucket does not lose a run.
      - name: Upload the report only if it never reached R2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report-fallback
          path: apps/trace-viewer/.evals/*.json
          if-no-files-found: ignore
