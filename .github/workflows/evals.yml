name: Evals

on:
  schedule:
    - cron: "0 3 */2 * *"
  workflow_dispatch:
    inputs:
      matrix:
        description: "provider:model pairs, comma separated"
        required: false
        default: ""

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch model credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev
          secret-path: /ai
          export-type: env

      - name: Evals
        run: pnpm test:evals
        env:
          EVAL_MATRIX: ${{ inputs.matrix || vars.EVAL_MATRIX }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: apps/trace-viewer/.evals/
          if-no-files-found: warn
