name: Images

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            target: prod
            turbo: true
          - name: app
            dockerfile: apps/app/Dockerfile
            target: prod
            turbo: true
          - name: convex-deploy
            dockerfile: packages/backend/Dockerfile
            target: prod
          - name: browser-mcp
            dockerfile: docker/browser-mcp.Dockerfile
            target: ""
    env:
      PREVIEW: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview') }}
      PUSH: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW == 'true' && github.event.pull_request.head.sha || github.sha }}

      - name: Fetch the turbo remote cache credentials from Infisical
        if: matrix.turbo
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /turbo
          export-type: env

      - name: Fetch the web build variables from Infisical
        if: matrix.name == 'app'
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /web
          export-type: file
          file-output-path: /../web-build-vars

      - name: Point the web build at the preview
        if: matrix.name == 'app' && env.PREVIEW == 'true'
        env:
          PR: ${{ github.event.number }}
        run: |
          domain=$(set -a; . ../web-build-vars; printf %s "$TAILNET_DOMAIN")
          test -n "$domain"
          grep -v -e '^VITE_API_URL=' -e '^VITE_CONVEX_URL=' ../web-build-vars > ../web-build-vars.preview
          printf "VITE_API_URL='https://lisptc-pr-%s-api.%s'\nVITE_CONVEX_URL='https://lisptc-pr-%s-convex.%s'\n" "$PR" "$domain" "$PR" "$domain" >> ../web-build-vars.preview
          mv ../web-build-vars.preview ../web-build-vars

      - name: Hash the web build variables
        id: web
        if: matrix.name == 'app'
        run: echo "hash=$(sha256sum ../web-build-vars | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lisptc-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=main-,enable={{is_default_branch}}
            type=sha,format=long,prefix=branch-,enable=${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }},enable=${{ env.PREVIEW == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: ${{ matrix.turbo && format('TURBO_TOKEN={0}{1}TURBO_REMOTE_CACHE_SIGNATURE_KEY={2}', env.TURBO_TOKEN, fromJSON('"\n"'), env.TURBO_REMOTE_CACHE_SIGNATURE_KEY) || '' }}
          build-args: WEB_BUILD_VARS_HASH=${{ steps.web.outputs.hash }}
          secret-files: ${{ matrix.name == 'app' && format('web-build-vars={0}/../web-build-vars', github.workspace) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
