configs:
  params:
    server.insecure: true

extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: argocd
      namespace: argocd
    spec:
      ingressClassName: tailscale
      defaultBackend:
        service:
          name: argocd-server
          port:
            number: 80
      tls:
        - hosts:
            - lisptc-argocd
