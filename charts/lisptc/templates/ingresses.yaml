{{- $ingresses := list
  (dict "name" "app" "host" (include "lisptc.appHostname" .) "service" "app" "port" .Values.app.port "wave" "0")
  (dict "name" "convex" "host" (include "lisptc.convexCloudHostname" .) "service" "convex-backend" "port" 3210 "wave" "1")
}}
{{- range $ingresses }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .wave | quote }}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ .service }}
      port:
        number: {{ .port }}
  tls:
    - hosts:
        - {{ .host }}
{{- end }}
