apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: app
  ports:
    - port: {{ .Values.app.port }}
      targetPort: {{ .Values.app.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      serviceAccountName: {{ .Values.app.serviceAccount }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          ports:
            - containerPort: {{ .Values.app.port }}
          envFrom:
            {{- range .Values.app.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: LISPTC_MCP_HOST
              value: kubernetes
            - name: LISPTC_MCP_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- include "lisptc.previewEnv" (list . (dict
                "APP_URL" .Values.app.hostname)) | nindent 12 }}
            {{- include "lisptc.previewConvexEnv" . | nindent 12 }}
            {{- if .Values.preview.enabled }}
            - name: LISPTC_OAUTH_REDIRECT_URL
              value: {{ printf "%s/oauth/callback" (include "lisptc.url" .Values.app.hostname) | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.app.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.app.port }}
            periodSeconds: 10
