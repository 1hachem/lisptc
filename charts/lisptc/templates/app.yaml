apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: app
  ports:
    - port: {{ .Values.app.port }}
      targetPort: {{ .Values.app.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  {{- if .Values.preview.enabled }}
  progressDeadlineSeconds: {{ .Values.preview.progressDeadlineSeconds }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      {{- if .Values.dev.enabled }}
      {{- with .Values.dev.node }}
      nodeSelector:
        kubernetes.io/hostname: {{ . }}
      {{- end }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      volumes:
        - name: docker
          hostPath:
            path: /var/run/docker.sock
            type: Socket
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ include "lisptc.imageTag" (list . .Values.app.image.tag) }}"
          ports:
            - containerPort: {{ .Values.app.port }}
          envFrom:
            {{- range .Values.app.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: PORT
              value: {{ .Values.app.port | quote }}
            {{- include "lisptc.previewEnv" (list . (dict
                "APP_URL" (include "lisptc.appHostname" .))) | nindent 12 }}
            {{- include "lisptc.clusterConvexEnv" . | nindent 12 }}
            {{- if .Values.preview.enabled }}
            - name: LISPTC_OAUTH_REDIRECT_URL
              value: {{ printf "%s/oauth/callback" (include "lisptc.url" (include "lisptc.appHostname" .)) | quote }}
            {{- end }}
          {{- if .Values.dev.enabled }}
          volumeMounts:
            - name: docker
              mountPath: /var/run/docker.sock
          {{- end }}
          livenessProbe:
            httpGet:
              {{- if .Values.dev.enabled }}
              host: 127.0.0.1
              {{- end }}
              path: /live
              port: {{ .Values.app.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              {{- if .Values.dev.enabled }}
              host: 127.0.0.1
              {{- end }}
              path: /health
              port: {{ .Values.app.port }}
            periodSeconds: 10
