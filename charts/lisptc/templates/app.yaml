apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: app
  ports:
    - port: {{ .Values.app.port }}
      targetPort: {{ .Values.app.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          ports:
            - containerPort: {{ .Values.app.port }}
          envFrom:
            {{- range .Values.app.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: PORT
              value: {{ .Values.app.port | quote }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.app.port }}
            periodSeconds: 10
