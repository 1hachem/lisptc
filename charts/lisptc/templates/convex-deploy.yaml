apiVersion: batch/v1
kind: Job
metadata:
  name: convex-deploy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: convex-deploy
          image: "{{ .Values.convexDeploy.image.repository }}:{{ .Values.release.tag }}"
          args: ["/etc/convex-env"]
          volumeMounts:
            - name: convex-env
              mountPath: /etc/convex-env
              readOnly: true
          env:
            - name: CONVEX_SELF_HOSTED_URL
              value: http://convex-backend:3210
            {{- include "lisptc.previewEnv" (list . (dict
                "PREVIEW_SITE_URL" .Values.app.hostname)) | nindent 12 }}
            - name: CONVEX_SELF_HOSTED_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: lisptc-convex
                  key: CONVEX_SELF_HOSTED_ADMIN_KEY
      volumes:
        - name: convex-env
          secret:
            secretName: lisptc-convex-deploy
