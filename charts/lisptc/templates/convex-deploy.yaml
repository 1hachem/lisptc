{{- if and .Values.dev.enabled .Values.dev.watch }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convex-deploy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: convex-deploy
  template:
    metadata:
      labels:
        app: convex-deploy
    spec:
{{- else }}
apiVersion: batch/v1
kind: Job
metadata:
  name: convex-deploy-{{ include "lisptc.imageTag" (list . .Values.convexDeploy.image.tag) | sha256sum | trunc 10 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: OnFailure
{{- end }}
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      {{- if .Values.dev.enabled }}
      {{- with .Values.dev.node }}
      nodeSelector:
        kubernetes.io/hostname: {{ . }}
      {{- end }}
      {{- end }}
      volumes:
        - name: deployment-env
          secret:
            secretName: lisptc-convex-deploy
      containers:
        - name: convex-deploy
          image: "{{ .Values.convexDeploy.image.repository }}:{{ include "lisptc.imageTag" (list . .Values.convexDeploy.image.tag) }}"
          command: ["sh", "-c"]
          args:
            - |
              set -e
              until node -e 'fetch(process.env.CONVEX_SELF_HOSTED_URL + "/version").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'; do
                sleep 2
              done
              pnpm exec convex env set --force --from-file /convex-deploy/deployment.env
              {{- if .Values.preview.enabled }}
              pnpm exec convex env set SITE_URL "$SITE_URL"
              {{- end }}
              {{- if and .Values.dev.enabled .Values.dev.watch }}
              pnpm exec convex dev --once --typecheck disable --codegen disable
              pnpm run migrate
              touch /tmp/pushed
              exec pnpm exec convex dev --typecheck disable --codegen disable
              {{- else }}
              pnpm exec convex deploy --typecheck disable --codegen disable
              exec pnpm run migrate
              {{- end }}
          {{- if and .Values.dev.enabled .Values.dev.watch }}
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/pushed"]
            periodSeconds: 2
          {{- end }}
          volumeMounts:
            - name: deployment-env
              mountPath: /convex-deploy
              readOnly: true
          env:
            - name: CONVEX_SELF_HOSTED_URL
              value: http://convex-backend:3210
            {{- include "lisptc.previewEnv" (list . (dict
                "SITE_URL" (include "lisptc.appHostname" .))) | nindent 12 }}
            - name: CONVEX_SELF_HOSTED_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: lisptc-convex
                  key: CONVEX_SELF_HOSTED_ADMIN_KEY
