apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.cluster }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.image }}
  storage:
    size: {{ .Values.postgres.storage }}
  bootstrap:
    initdb:
      postInitSQLRefs:
        secretRefs:
          - name: {{ .Values.postgres.init }}
            key: role.sql
          - name: {{ .Values.postgres.init }}
            key: database.sql
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.postgres.cluster }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.postgres.cluster }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
