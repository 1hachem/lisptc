apiVersion: v1
kind: Service
metadata:
  name: convex-backend
spec:
  selector:
    app: convex-backend
  ports:
    - name: cloud
      port: 3210
      targetPort: 3210
    - name: site
      port: 3211
      targetPort: 3211
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: convex-backend
spec:
  serviceName: convex-backend
  replicas: 1
  selector:
    matchLabels:
      app: convex-backend
  template:
    metadata:
      labels:
        app: convex-backend
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: convex-backend
          image: {{ .Values.convex.backend.image }}
          ports:
            - containerPort: 3210
            - containerPort: 3211
          envFrom:
            {{- range .Values.convex.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: INSTANCE_NAME
              value: $(POSTGRES_DB)
            - name: INSTANCE_SECRET
              value: $(CONVEX_INSTANCE_SECRET)
            - name: POSTGRES_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432
            - name: DO_NOT_REQUIRE_SSL
              value: "true"
            - name: DISABLE_BEACON
              value: "true"
            - name: REDACT_LOGS_TO_CLIENT
              value: "false"
          readinessProbe:
            httpGet:
              path: /version
              port: 3210
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /convex/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.convex.backend.storage }}
