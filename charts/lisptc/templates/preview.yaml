{{- if .Values.preview.enabled }}
{{- $infisical := .Values.preview.infisical }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    lisptc.io/preview: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: {{ .Release.Namespace }}
  namespace: argocd
spec:
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: regexp:^pr-{{ required "preview.number is required" .Values.preview.number }}-[0-9a-f]{40}$
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: {{ .Release.Namespace }}
      images:
        - alias: app
          imageName: {{ .Values.app.image.repository }}
          manifestTargets:
            helm:
              name: app.image.repository
              tag: app.image.tag
        - alias: convex-deploy
          imageName: {{ .Values.convexDeploy.image.repository }}
          manifestTargets:
            helm:
              name: convexDeploy.image.repository
              tag: convexDeploy.image.tag
{{- range .Values.preview.synced }}
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-{{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: {{ $infisical.hostAPI }}
  syncConfig:
    resyncInterval: {{ $infisical.resyncInterval | quote }}
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: {{ $infisical.projectSlug }}
        envSlug: {{ $infisical.envSlug }}
        secretsPath: {{ .path | quote }}
      credentialsRef:
        secretName: {{ $infisical.credentials.secretName }}
        secretNamespace: {{ $infisical.credentials.secretNamespace }}
  managedKubeSecretReferences:
    - secretName: {{ .secretName }}
      secretNamespace: {{ $.Release.Namespace }}
      creationPolicy: Owner
      {{- with .secretType }}
      secretType: {{ . }}
      {{- end }}
      {{- with .template }}
      template:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
