apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-state
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.api.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        fsGroup: 1001
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            {{- range .Values.api.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            periodSeconds: 10
          volumeMounts:
            - name: state
              mountPath: /data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: api-state
