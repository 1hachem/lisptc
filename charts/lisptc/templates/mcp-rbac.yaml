apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.app.serviceAccount }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-mcp-host
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, update, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, update, delete, deletecollection]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-mcp-host
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-mcp-host
subjects:
  - kind: ServiceAccount
    name: {{ .Values.app.serviceAccount }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-pull-secret
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.imagePullSecret }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-pull-secret
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-pull-secret
subjects:
  - kind: ServiceAccount
    name: {{ .Values.app.serviceAccount }}
    namespace: {{ .Release.Namespace }}
