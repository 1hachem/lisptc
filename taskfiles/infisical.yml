version: '3'
silent: true
vars:
  PROJECTID: 2601ca1c-d740-482b-b0f9-62ad78773f62
tasks:
  _infisical-run:
    dir: '{{.ROOT_DIR}}'
    requires:
      vars: [ENV, PATHS, CMD]
    vars:
      DIR: '{{.DIR | default "."}}'
    cmd: |
      node --no-warnings --experimental-transform-types ./scripts/infisical-run.ts -e {{.ENV}} \
       --projectId={{.PROJECTID}} \
       --paths="{{.PATHS}}" --dir={{.DIR}} "{{.CMD}}"
