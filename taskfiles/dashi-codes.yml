version: '3'
silent: true
includes:
  infisical:
    taskfile: ./infisical.yml
    flatten: true
tasks:
  default:
    desc: build the dashboard, serve it, and open a browser on it
    cmds:
      - task: open

  open:
    desc: build the dashboard, serve it, and open a browser on it
    vars:
      PORT: '{{.PORT | default "3300"}}'
      URL: 'http://localhost:{{.PORT}}'
    cmds:
      - |
        (
          for _ in $(seq 480); do
            if curl -sf -o /dev/null "{{.URL}}"; then
              if command -v xdg-open >/dev/null 2>&1; then xdg-open "{{.URL}}"
              elif command -v open >/dev/null 2>&1; then open "{{.URL}}"
              else echo "the dashboard is at {{.URL}}"
              fi
              exit 0
            fi
            sleep 0.5
          done
          echo "the dashboard never answered on {{.URL}}"
        ) >/dev/null 2>&1 &
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/assets"
          CMD: 'PORT={{.PORT}} pnpm run build --filter @lisptc/dashi-code && pnpm --filter @lisptc/dashi-code start'

  dev:
    desc: run the dashboard in dev mode with access to secrets
    vars:
      PORT: '{{.PORT | default "3300"}}'
    cmds:
      - task: _infisical-run
        vars:
          ENV: '{{.ENV | default "dev"}}'
          PATHS: "/assets"
          CMD: 'PORT={{.PORT}} pnpm run dev --filter @lisptc/dashi-code'

  build:
    desc: build the dashboard
    cmd: pnpm run build --filter @lisptc/dashi-code

  local:
    desc: run the dashboard against the mounted bucket, no secrets
    vars:
      PORT: '{{.PORT | default "3300"}}'
      DIR: '{{.DIR | default ".r2/fallow"}}'
    cmd: DASHI_CODES_STORAGE=local DASHI_CODES_DIR="{{.DIR}}" PORT={{.PORT}} pnpm run dev --filter @lisptc/dashi-code

  capture:docker:
    desc: flush a container's V8 coverage so the dashboard can fold it in (needs NODE_V8_COVERAGE=/coverage)
    vars:
      SERVICE: '{{.SERVICE | default "api"}}'
    cmds:
      - mkdir -p .coverage/{{.SERVICE}}
      - docker compose stop {{.SERVICE}}
      - |
        one=$(ls -S .coverage/{{.SERVICE}}/coverage-*.json 2>/dev/null | head -1)
        if [ -z "$one" ]; then
          echo "no dump in .coverage/{{.SERVICE}}/ — the container was not recording."
          echo "bring the stack up with coverage on, exercise it, then run this again:"
          echo "  NODE_V8_COVERAGE=/coverage task up"
          docker compose start {{.SERVICE}}
          exit 1
        fi
        sed 's|file:///app/||g' "$one" > .coverage/{{.SERVICE}}-rebased.json
        echo "rebased $one — hit refresh in the dashboard to fold it in"
      - docker compose start {{.SERVICE}}
