version: '3'
silent: true
vars:
  HELMFILE: '{{.ROOT_DIR}}/deploy/helmfile.yaml.gotmpl'
  STAGE: prod
tasks:
  _reachable:
    internal: true
    cmd: |
      ctx=$(kubectl config current-context 2>/dev/null || true)
      kubectl cluster-info --request-timeout=5s >/dev/null 2>&1 && exit 0
      echo "cannot reach the cluster for context '$ctx'. On the k3s laptop: export KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >&2
      exit 1

  credentials:
    desc: write the Infisical machine identity the operator reads (INFISICAL_CLIENT_ID/SECRET from .env)
    deps: [_reachable]
    requires:
      vars: [INFISICAL_CLIENT_ID, INFISICAL_CLIENT_SECRET]
    cmd: |
      kubectl create namespace infisical --dry-run=client -o yaml | kubectl apply -f -
      id=$(printf %s "$INFISICAL_CLIENT_ID" | base64 -w0)
      secret=$(printf %s "$INFISICAL_CLIENT_SECRET" | base64 -w0)
      printf 'apiVersion: v1\nkind: Secret\nmetadata:\n  name: lisptc-infisical-cred\n  namespace: infisical\ndata:\n  clientId: %s\n  clientSecret: %s\n' "$id" "$secret" \
        | kubectl apply -f -

  bootstrap:
    desc: install the Infisical and Tailscale operators, ArgoCD and the root app; ArgoCD pulls the rest from main
    cmds:
      - task: credentials
      - helmfile sync -e {{.STAGE}} -f {{.HELMFILE}} {{.CLI_ARGS}}
      - task: status

  sync:
    desc: re-apply the bootstrap layer after a change to deploy/ or a bootstrap chart
    deps: [_reachable]
    cmd: helmfile sync -e {{.STAGE}} -f {{.HELMFILE}} {{.CLI_ARGS}}

  diff:
    desc: show what sync would change in the bootstrap layer
    deps: [_reachable]
    cmd: helmfile diff -e {{.STAGE}} -f {{.HELMFILE}} {{.CLI_ARGS}}

  refresh:
    desc: make ArgoCD pull main now instead of on its next poll
    deps: [_reachable]
    cmd: |
      for app in root secrets lisptc argocd-image-updater cloudnative-pg kube-prometheus-stack loki alloy; do
        kubectl -n argocd annotate application "$app" argocd.argoproj.io/refresh=hard --overwrite
      done

  _argocd:
    internal: true
    requires:
      vars: [ARGS]
    cmds:
      - task: :_infisical-run
        vars: { ENV: prod, PATHS: "/argocd", CMD: 'export ARGOCD_SERVER=\${ARGOCD_BASE_URL#https://} ARGOCD_AUTH_TOKEN=\$ARGOCD_API_TOKEN ARGOCD_OPTS=--grpc-web && {{.ARGS}}' }

  previews:pin:
    desc: 'render every preview from a branch instead of main, root stops self-healing until unpin (task cluster:previews:pin -- feat/x, default the current branch)'
    vars:
      CURRENT:
        sh: git branch --show-current
      BRANCH: '{{.CLI_ARGS | default .CURRENT}}'
    cmds:
      - task: _argocd
        vars: { ARGS: 'argocd app set argocd/root --self-heal=false && argocd app set argocd/previews --revision {{.BRANCH}} && argocd app sync argocd/previews' }

  previews:unpin:
    desc: put the previews back on main and let root self-heal again
    cmds:
      - task: _argocd
        vars: { ARGS: 'argocd app set argocd/root --self-heal && argocd app set argocd/previews --revision main && argocd app sync argocd/previews' }

  status:
    desc: 'show the ArgoCD apps, the release Job, the pods and the tailnet hosts (PR=12 for a preview)'
    deps: [_reachable]
    vars:
      NS: '{{if .PR}}lisptc-pr-{{.PR}}{{else}}lisptc{{end}}'
    cmd: |
      kubectl -n argocd get applications
      kubectl -n {{.NS}} get jobs -o custom-columns=JOB:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,SUCCEEDED:.status.succeeded,FAILED:.status.failed,STARTED:.status.startTime
      kubectl -n {{.NS}} get pods
      kubectl get ingress -A -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,HOST:.status.loadBalancer.ingress[0].hostname

  logs:
    desc: 'follow the logs of a workload (task cluster:logs -- deploy/app, PR=12 for a preview)'
    deps: [_reachable]
    vars:
      NS: '{{if .PR}}lisptc-pr-{{.PR}}{{else}}lisptc{{end}}'
    cmd: kubectl -n {{.NS}} logs -f {{.CLI_ARGS | default "deploy/app"}}

  lint:
    desc: lint the local charts, no cluster needed
    dir: '{{.ROOT_DIR}}/charts'
    cmd: |
      for chart in */; do
        [ -f "$chart/Chart.yaml" ] || continue
        helm lint "$chart" --quiet
      done

  render:
    desc: render every chart the cluster runs with the values it runs them with, no cluster needed
    cmd: '{{.ROOT_DIR}}/scripts/render-charts.sh'
